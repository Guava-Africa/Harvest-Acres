<div 
  class="mb-8"
  [ngClass]="{
    'text-center': align === 'center',
    'text-left': align === 'left'
  }"
>

  <!-- Title -->
  <h2 class="text-2xl md:text-3xl font-semibold text-secondary">
    {{ title }}
  </h2>

  <!-- Subtitle -->
  <p 
    *ngIf="subtitle"
    class="text-sm text-gray-500 mt-2 max-w-2xl"
    [ngClass]="{
      'mx-auto': align === 'center',
      'mx-0': align === 'left'
    }"
  >
    {{ subtitle }}
  </p>

</div>
