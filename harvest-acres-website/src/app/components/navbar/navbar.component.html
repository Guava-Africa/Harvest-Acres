<header
  class="navbar"
  [class.navbar--scrolled]="isScrolled"
  [class.navbar--open]="isMenuOpen"
>
  <div class="navbar-inner">

    <a routerLink="/" class="navbar-brand-group" (click)="closeMenu()" aria-label="Harvest Acres — Home">
      <img
        src="/Images/harvest-acres-logo%20(1).png"
        alt=""
        class="navbar-logo"
        aria-hidden="true"
      />
      <span class="navbar-brand-text">Harvest Acres</span>
    </a>

    <nav class="navbar-nav" aria-label="Main navigation">
      <a
        routerLink="/"
        routerLinkActive="is-active"
        [routerLinkActiveOptions]="{ exact: true }"
        class="nav-link"
      >Home</a>

      <div class="nav-dropdown group">
        <a
          routerLink="/about"
          routerLinkActive="is-active"
          [routerLinkActiveOptions]="{ exact: true }"
          class="nav-link nav-link--dropdown"
        >
          About
          <svg class="nav-chevron" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
            <path fill-rule="evenodd" d="M5.23 7.21a.75.75 0 011.06.02L10 11.168l3.71-3.94a.75.75 0 111.08 1.04l-4.25 4.5a.75.75 0 01-1.08 0l-4.25 4.5a.75.75 0 01.02-1.06z" clip-rule="evenodd" />
          </svg>
        </a>
        <div class="nav-dropdown-menu">
          <a routerLink="/about#team" class="nav-dropdown-item">Our Team</a>
          <a routerLink="/governance" class="nav-dropdown-item">Corporate Governance</a>
        </div>
      </div>

      <a
        routerLink="/services"
        routerLinkActive="is-active"
        [routerLinkActiveOptions]="{ exact: true }"
        class="nav-link"
      >Products</a>

      <a
        routerLink="/innovative-business"
        routerLinkActive="is-active"
        [routerLinkActiveOptions]="{ exact: true }"
        class="nav-link"
      >Innovative Business</a>

      <a
        routerLink="/contact"
        routerLinkActive="is-active"
        [routerLinkActiveOptions]="{ exact: true }"
        class="nav-link"
      >Contact</a>
    </nav>

    <div class="navbar-actions">
      <button
        type="button"
        class="theme-toggle"
        (click)="toggleTheme()"
        [attr.aria-label]="theme() === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'"
        [attr.title]="theme() === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'"
      >
        @if (theme() === 'dark') {
          <svg class="theme-toggle-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
          </svg>
        } @else {
          <svg class="theme-toggle-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 14.3A9 9 0 1 1 9.7 3a7 7 0 0 0 11.3 11.3z"/>
          </svg>
        }
      </button>

      <button
        type="button"
        class="navbar-toggle"
        (click)="toggleMenu()"
        [attr.aria-expanded]="isMenuOpen"
        aria-controls="mobile-nav"
        aria-label="Toggle menu"
      >
        <span class="navbar-toggle-bar" [class.is-open]="isMenuOpen"></span>
        <span class="navbar-toggle-bar" [class.is-open]="isMenuOpen"></span>
        <span class="navbar-toggle-bar" [class.is-open]="isMenuOpen"></span>
      </button>
    </div>

  </div>

  <div id="mobile-nav" class="navbar-mobile" [class.is-open]="isMenuOpen">
    <nav class="navbar-mobile-nav" aria-label="Mobile navigation">
      <a routerLink="/" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }" class="mobile-link" (click)="closeMenu()">Home</a>
      <a routerLink="/about" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }" class="mobile-link" (click)="closeMenu()">About</a>
      <a routerLink="/about#team" class="mobile-link mobile-link--sub" (click)="closeMenu()">Our Team</a>
      <a routerLink="/governance" class="mobile-link mobile-link--sub" (click)="closeMenu()">Corporate Governance</a>
      <a routerLink="/services" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }" class="mobile-link" (click)="closeMenu()">Products</a>
      <a routerLink="/innovative-business" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }" class="mobile-link" (click)="closeMenu()">Innovative Business</a>
      <a routerLink="/contact" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }" class="mobile-link" (click)="closeMenu()">Contact</a>
    </nav>
  </div>
</header>
