<header
  class="navbar"
  [class.navbar--scrolled]="isScrolled"
  [class.navbar--open]="isMenuOpen"
>
  <div class="navbar-inner">

    <!-- Logo -->
    <a routerLink="/" class="navbar-brand" (click)="closeMenu()">
      <img
        src="/images/harvest-acres-logo.png"
        alt="Harvest Acres"
        class="navbar-logo"
      />
    </a>

    <!-- Desktop navigation -->
    <nav class="navbar-nav hidden lg:flex" aria-label="Main navigation">
      <a
        routerLink="/"
        routerLinkActive="is-active"
        [routerLinkActiveOptions]="{ exact: true }"
        class="nav-link"
      >Home</a>

      <div class="nav-dropdown group">
        <a
          routerLink="/about"
          routerLinkActive="is-active"
          [routerLinkActiveOptions]="{ exact: true }"
          class="nav-link nav-link--dropdown"
        >
          About
          <svg class="nav-chevron" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
            <path fill-rule="evenodd" d="M5.23 7.21a.75.75 0 011.06.02L10 11.168l3.71-3.94a.75.75 0 111.08 1.04l-4.25 4.5a.75.75 0 01-1.08 0l-4.25-4.5a.75.75 0 01.02-1.06z" clip-rule="evenodd" />
          </svg>
        </a>
        <div class="nav-dropdown-menu">
          <a routerLink="/about#team" class="nav-dropdown-item">Our Team</a>
          <a routerLink="/governance" class="nav-dropdown-item">Corporate Governance</a>
        </div>
      </div>

      <a
        routerLink="/services"
        routerLinkActive="is-active"
        [routerLinkActiveOptions]="{ exact: true }"
        class="nav-link"
      >Products</a>

      <a
        routerLink="/innovation"
        routerLinkActive="is-active"
        [routerLinkActiveOptions]="{ exact: true }"
        class="nav-link"
      >Innovation</a>

      <a
        routerLink="/business"
        routerLinkActive="is-active"
        [routerLinkActiveOptions]="{ exact: true }"
        class="nav-link"
      >Business</a>

      <a
        routerLink="/careers"
        routerLinkActive="is-active"
        [routerLinkActiveOptions]="{ exact: true }"
        class="nav-link"
      >Careers</a>

      <a
        routerLink="/contact"
        routerLinkActive="is-active"
        [routerLinkActiveOptions]="{ exact: true }"
        class="nav-link"
      >Contact</a>
    </nav>

    <!-- Desktop CTA -->
    <a routerLink="/contact" class="navbar-cta hidden lg:inline-flex">
      Partner With Us
    </a>

    <!-- Mobile toggle -->
    <button
      type="button"
      class="navbar-toggle lg:hidden"
      (click)="toggleMenu()"
      [attr.aria-expanded]="isMenuOpen"
      aria-label="Toggle navigation menu"
    >
      <span class="navbar-toggle-bar" [class.is-open]="isMenuOpen"></span>
      <span class="navbar-toggle-bar" [class.is-open]="isMenuOpen"></span>
      <span class="navbar-toggle-bar" [class.is-open]="isMenuOpen"></span>
    </button>

  </div>

  <!-- Mobile menu -->
  <div class="navbar-mobile" [class.is-open]="isMenuOpen">
    <nav class="navbar-mobile-nav" aria-label="Mobile navigation">
      <a routerLink="/" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }" class="mobile-link" (click)="closeMenu()">Home</a>
      <a routerLink="/about" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }" class="mobile-link" (click)="closeMenu()">About</a>
      <a routerLink="/about#team" class="mobile-link mobile-link--sub" (click)="closeMenu()">Our Team</a>
      <a routerLink="/governance" class="mobile-link mobile-link--sub" (click)="closeMenu()">Corporate Governance</a>
      <a routerLink="/services" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }" class="mobile-link" (click)="closeMenu()">Products</a>
      <a routerLink="/innovation" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }" class="mobile-link" (click)="closeMenu()">Innovation</a>
      <a routerLink="/business" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }" class="mobile-link" (click)="closeMenu()">Business</a>
      <a routerLink="/careers" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }" class="mobile-link" (click)="closeMenu()">Careers</a>
      <a routerLink="/contact" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }" class="mobile-link" (click)="closeMenu()">Contact</a>
      <a routerLink="/contact" class="mobile-cta" (click)="closeMenu()">Partner With Us</a>
    </nav>
  </div>
</header>
